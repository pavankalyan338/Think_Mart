<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Think Mart</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">Think<span>Mart</span></a>
    </nav>
  </header>

  <main>
    <div class="auth-container">
      <h2>Create Account</h2>
      <form action="index.html" method="GET">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="enter name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="enter email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="enter password" required>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="re-enter password" required>
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
      <div class="auth-footer">
        Already have an account? <a href="index.html">Login here</a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Think Mart. All rights reserved.</p>
  </footer>

</body>
</html>
